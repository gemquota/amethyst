name: build-amethyst
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gemquota/amethyst
          ref: feat/fdroid-libretranslate
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Ensure SDK platform 37
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37" "platform-tools" > /dev/null 2>&1 || echo "already present"
      - name: Build both debug APKs + F-Droid unit test
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          ./gradlew :amethyst:assemblePlayDebug :amethyst:assembleFdroidDebug :amethyst:testFdroidDebugUnitTest --no-daemon
      - name: Show artifacts
        run: find amethyst/build/outputs/apk -name "*.apk" -exec ls -la {} \;
      - uses: actions/upload-artifact@v4
        with:
          name: amethyst-debug-apks
          path: |
            amethyst/build/outputs/apk/play/debug/*.apk
            amethyst/build/outputs/apk/fdroid/debug/*.apk
          if-no-files-found: error

  emulator:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: amethyst-debug-apks
          path: apks
      - name: Install + launch both flavors on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -x
            timeout 30 adb wait-for-device || echo WAIT_DEVICE_FAIL
            adb devices
            timeout 10 adb shell getprop sys.boot_completed || true
            echo "=== F-Droid flavor ==="
            timeout 600 adb install -r apks/fdroid/debug/amethyst-fdroid-x86_64-debug.apk || echo FDROID_INSTALL_FAIL
            timeout 20 adb shell pm list packages 2>/dev/null | grep amethyst || echo FDROID_NOT_INSTALLED
            timeout 60 adb shell am start -n com.vitorpamplona.amethyst.debug/com.vitorpamplona.amethyst.ui.MainActivity || true
            sleep 20
            timeout 30 adb exec-out screencap -p > fdroid_home.png || echo FDROID_SCREENCAP_FAIL
            timeout 60 adb uninstall com.vitorpamplona.amethyst.debug || echo FDROID_UNINSTALL_FAIL
            echo "=== Play flavor ==="
            timeout 600 adb install -r apks/play/debug/amethyst-play-x86_64-debug.apk || echo PLAY_INSTALL_FAIL
            timeout 20 adb shell pm list packages 2>/dev/null | grep amethyst || echo PLAY_NOT_INSTALLED
            timeout 60 adb shell am start -n com.vitorpamplona.amethyst.debug/com.vitorpamplona.amethyst.ui.MainActivity || true
            sleep 20
            timeout 30 adb exec-out screencap -p > play_home.png || echo PLAY_SCREENCAP_FAIL
            echo "=== done ==="
            ls -la *.png || true
      - uses: actions/upload-artifact@v4
        with:
          name: amethyst-emulator-screens
          path: |
            fdroid_home.png
            play_home.png
          if-no-files-found: warn
